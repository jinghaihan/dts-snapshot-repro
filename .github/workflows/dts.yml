name: DTS snapshot reproducibility

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Reproduce per-file TypeScript declaration ordering
        run: pnpm reproduce:tsc-order
      - name: Generate declarations with TypeScript
        run: pnpm exec tsc --rootDir src --outDir tsc-dist --pretty false
      - name: Print TypeScript declaration
        run: cat tsc-dist/core/image.d.ts
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: tsc-${{ matrix.os }}
          path: tsc-dist/core/image.d.ts
      - name: Generate declaration without snapshot validation
        run: pnpm exec tsdown -c tsdown.no-snapshot.config.ts
      - name: Print generated declaration
        run: cat dist/index.d.mts
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: dts-${{ matrix.os }}
          path: dist/index.d.mts
      - name: Run API snapshot validation
        run: pnpm build

  compare:
    name: Compare declarations
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dts-*
          path: artifacts
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          pattern: tsc-*
          path: tsc-artifacts
          merge-multiple: false
      - name: Show hashes and differences
        shell: bash
        run: |
          find artifacts -type f -print0 | sort -z | xargs -0 sha256sum
          find tsc-artifacts -type f -print0 | sort -z | xargs -0 sha256sum
          for file in artifacts/*/index.d.mts; do
            echo "--- $file"
            cat "$file"
          done
          for file in tsc-artifacts/*/image.d.ts; do
            echo "--- $file"
            cat "$file"
          done
